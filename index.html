<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    tbody tr { cursor: pointer; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h1>Пользователи</h1>

    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
      + Добавить
    </button>

    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Имя</th><th>Email</th></tr>
      </thead>
      <tbody id="users-table-body"></tbody>
    </table>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <form id="add-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Новый пользователь</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="name" class="form-control mb-2" placeholder="Имя" required>
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Инфо</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="user-info"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
